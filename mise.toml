[tasks.release]
description = "Build the optimized Power binary"
run = "mise exec zig@0.17.1 -- cargo build --release --locked"

[tasks.dev]
description = "Rebuild Power, restart its daemon, and launch the GUI (POWER_FORCE_RESTART=1 skips the worker check)"
depends = ["release"]
run = """
#!/usr/bin/env bash
set -euo pipefail
# SIGTERM lets the daemon save its sessions. Running processes still end, including the tab
# this may run in, and the new daemon recreates each session and resumes its agent.
# The check asks the daemon on this caller's socket (POWER_SOCKET or the default). It
# refuses, or asks, while DAG workers are mid-task, and refuses when that daemon does not
# answer. Then it stops that daemon through a handle on the process it checked, so the
# signals never reach a process that reused its PID.
./target/release/power restart-check --stop >/dev/null
# The GUI starts a fresh daemon from this binary when none is listening.
exec ./target/release/power
"""

[tasks.install]
description = "Install Power into ~/.local/bin and restart an outdated daemon (POWER_FORCE_RESTART=1 skips the worker check)"
depends = ["release"]
run = """
#!/usr/bin/env bash
set -euo pipefail
dest_dir="${POWER_INSTALL_DIR:-$HOME/.local/bin}"
dest="$dest_dir/power"
mkdir -p "$dest_dir"
# Copy then rename so a running daemon or GUI keeps its old inode instead of failing with ETXTBSY.
tmp="$(mktemp "$dest_dir/.power.XXXXXX")"
trap 'rm -f "$tmp"' EXIT
install -m 0755 target/release/power "$tmp"
mv -f "$tmp" "$dest"
trap - EXIT
echo "Installed $dest"

# Desktop entry so app launchers (Walker, GNOME, KDE, rofi) list Power.
apps_dir="${XDG_DATA_HOME:-$HOME/.local/share}/applications"
mkdir -p "$apps_dir"
cat > "$apps_dir/power.desktop" <<EOF
[Desktop Entry]
Type=Application
Name=Power Overwhelming
GenericName=Agent Workspace
Comment=Launch the Power GUI
Exec=$dest
TryExec=$dest
Icon=utilities-terminal
Terminal=false
Categories=Development;
StartupNotify=true
EOF
if command -v update-desktop-database >/dev/null; then
  update-desktop-database "$apps_dir" || true
fi
echo "Installed $apps_dir/power.desktop"

# The daemon and client share one binary. Restart only the daemon on this caller's socket
# (POWER_SOCKET or the default), and only when it runs different bytes. Restarting ends
# every session it hosts, including the tab this may run in.
# Refuses, or asks, while DAG workers are mid-task, and refuses when the daemon does not
# answer. It stops the daemon it checked, through a handle on that process, unless it
# already runs the installed bytes.
# It prints the PID it stopped, or nothing when none listens or it is up to date.
if ! stopped="$("$dest" restart-check --stop --unless-exe "$dest")"; then
  echo "Installed, but left the running daemon alone. It restarts from $dest next time." >&2
  exit 1
fi
if [[ -n "$stopped" ]]; then
  # Any session command starts a detached daemon from the installed binary.
  "$dest" session list >/dev/null
  echo "Daemon restarted from $dest"
fi
"""
