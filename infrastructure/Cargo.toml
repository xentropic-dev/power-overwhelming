[package]
name = "infrastructure"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
async-channel = "2"
application = { path = "../application" }
base64 = "0.22"
chrono = { version = "0.4", optional = true }
domain = { path = "../domain" }
fs2 = "0.4"
ghostty-vt = "0.9"
image = "0.25"
libc = "0.2"
mlua = { version = "0.11", features = ["error-send", "lua54", "serde", "vendored"], optional = true }
portable-pty = "0.9"
rusqlite = { version = "0.33", features = ["bundled"] }
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
sha2 = "0.10"
tempfile = "3"
toml = "1.2"
uuid = { version = "1", features = ["v4"] }

[features]
lua-config = ["dep:mlua"]
wasm-plugins = ["dep:chrono", "dep:wasmtime", "lua-config"]

[dependencies.wasmtime]
version = "51"
optional = true
default-features = false
features = ["anyhow", "cache", "component-model", "cranelift", "runtime", "std"]

[[bin]]
name = "power-plugin-host"
path = "src/bin/power-plugin-host.rs"
required-features = ["wasm-plugins"]

[dev-dependencies]
wat = "1"
