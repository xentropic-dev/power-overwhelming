[package]
name = "infrastructure"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1"
application = { path = "../application" }
base64 = "0.22"
domain = { path = "../domain" }
fs2 = "0.4"
ghostty-vt = "0.9"
libc = "0.2"
portable-pty = "0.9"
rusqlite = { version = "0.33", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[features]
wasm-plugins = ["dep:wasmtime"]

[dependencies.wasmtime]
version = "51"
optional = true
default-features = false
features = ["anyhow", "cache", "component-model", "cranelift", "runtime", "std"]

[[bin]]
name = "power-plugin-host"
path = "src/bin/power-plugin-host.rs"
required-features = ["wasm-plugins"]

[dev-dependencies]
tempfile = "3"
wat = "1"
