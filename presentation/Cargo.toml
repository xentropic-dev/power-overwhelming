[package]
name = "power-overwhelming"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "power"

[[bin]]
name = "power"
path = "src/main.rs"

[dependencies]
anyhow = "1"
application = { path = "../application" }
async-channel = "2"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
domain = { path = "../domain" }
fontdb = "0.16"
ghostty-vt = "0.9"
gpui = { version = "=0.2.2", default-features = false, features = ["wayland"] }
gpui-video-player = "=0.1.3"
ignore = "0.4.35"
image = "0.25"
infrastructure = { path = "../infrastructure", features = ["wasm-plugins"] }
mime_guess = "2"
nucleo-matcher = "0.3.1"
percent-encoding = "2"
regex = "1"
serde_json = "1"
tempfile = "3"
tiny_http = "0.12"
ttf-parser = { version = "0.20", default-features = false, features = ["std"] }
unicode-width = "0.2"
url = "2"

[build-dependencies]
cc = "1"
pkg-config = "0.3"

[dev-dependencies]
rusqlite = { version = "0.33", features = ["bundled"] }
base64 = "0.22"
# A headless window to drive terminal gestures end to end.
gpui = { version = "=0.2.2", default-features = false, features = ["wayland", "test-support"] }

# GPUI's Linux shaper, to shape terminal runs in tests without a window.
[target.'cfg(target_os = "linux")'.dev-dependencies]
cosmic-text = "=0.14.2"
