[workspace]
members = ["application", "domain", "infrastructure", "presentation"]
default-members = ["presentation"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[profile.dev]
debug = 0

[patch.crates-io]
# GPUI's Linux font database can read cached Fontconfig metadata instead of opening every font.
fontdb = { path = "vendor/fontdb" }
# GPUI's zed-async-tar depends on xattr 0.2, whose Linux ENOATTR alias libc removed.
xattr = { path = "vendor/xattr" }
